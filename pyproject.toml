[project]
name = "ledger-sentinel"
version = "0.1.0"
description = "Three-way reconciliation with a deterministic core and a gated AI exception classifier."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.36,<2",
    "openai>=1.40,<3",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
