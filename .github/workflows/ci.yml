name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python is pinned to 3.11 explicitly. pyproject requires >=3.11,<3.12, and
      # the runner's default is newer -- an unpinned install would resolve to a
      # version the project refuses. Plain pip rather than a third-party action:
      # one less thing that can be yanked out from under a deadline.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # First, and on its own, so a leak is the first thing the log says rather
      # than something buried in a 200-test summary. A secret that reaches a
      # remote is compromised whether or not it is reverted -- the fix is a
      # rotated key -- so this belongs upstream of the push, not after it.
      - name: No committed secrets
        run: pytest tests/test_no_secrets.py -q

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=src --cov-report=term-missing

      # The dataset is the quality ceiling, so prove it regenerates byte-identically
      # rather than trusting the committed CSVs.
      - name: Dataset is reproducible
        run: |
          python -m data.generator --seed A
          python -m data.generator --seed B
          python -m data.generator --readme
          git diff --exit-code -- data/

      # Same discipline for the metrics document: no number in any file in this
      # repository is typed by hand. If the code and the document disagree, the
      # document is wrong and the build says so.
      #
      # Regenerated with --ai, because the committed document reports the full
      # system. This needs no key: the classifier replays the committed cache.
      - name: Metrics document is regenerated, not written
        run: |
          python -m src.metrics --seed B --ai
          git diff --exit-code -- docs/

      # A reconciliation claim that is not reproducible is not a claim. This runs
      # without a key: the classifier replays the committed response cache.
      - name: Three identical runs
        run: python scripts/determinism.py --seed B --runs 3

      # The demo must work from a clean checkout with no key and no network. If a
      # cache is committed this exercises the full pipeline; if not, it proves the
      # deterministic baseline still stands on its own.
      - name: Offline pipeline
        env:
          OPENAI_API_KEY: ""
        run: |
          python -m src.metrics --seed B --no-markdown
          test -s cache/llm_responses.jsonl && python scripts/determinism.py --seed B --runs 3 --ai || \
            echo "no recorded cache in this checkout; deterministic layer only"
